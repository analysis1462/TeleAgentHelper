name: windows-build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build GUI
        shell: pwsh
        run: .\scripts\build-teleagent-gui-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleAgentHelper
          path: dist/TeleAgentHelper-v*.exe
          if-no-files-found: error
