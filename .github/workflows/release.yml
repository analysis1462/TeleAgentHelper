name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GUI
        shell: pwsh
        run: .\scripts\build-teleagent-gui-windows.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TeleAgentHelper-v*.exe
          generate_release_notes: true
